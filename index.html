<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Checkys</title><style>

button.b,a.b{display:block;width:100%;border:0;border-radius:15px;padding:14px;font:inherit;font-weight:700;background:var(--g1);color:#fff;box-shadow:var(--sh);margin-top:10px;cursor:pointer;transition:transform .15s,filter .15s,background .15s}

@media(min-width:600px){body{background:radial-gradient(900px 500px at 5% -10%,#d6e6ff,transparent),radial-gradient(700px 500px at 100% 0,#d3f6e8,transparent),#f4f8ff}#app{background:#fff;box-shadow:0 40px 90px -35px rgba(26,107,240,.4);border-radius:30px;margin:24px auto;min-height:calc(100vh - 48px)}}

@keyframes bob{0%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
@keyframes sheen{to{transform:translateX(420%) skewX(-20deg)}}

@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.in>*,#app>main:last-child>*{animation:up .65s cubic-bezier(.2,.8,.2,1) backwards}
.in>:nth-child(2),#app>main:last-child>:nth-child(2){animation-delay:.08s}.in>:nth-child(3),#app>main:last-child>:nth-child(3){animation-delay:.16s}.in>:nth-child(4),#app>main:last-child>:nth-child(4){animation-delay:.24s}.in>:nth-child(5),#app>main:last-child>:nth-child(5){animation-delay:.32s}.in>:nth-child(n+6),#app>main:last-child>:nth-child(n+6){animation-delay:.4s}
body{background:#fff}
@media(max-width:599px){body{background:radial-gradient(520px 280px at 95% -60px,#dcebff,transparent),radial-gradient(420px 260px at -15% 140px,#d9f6ec,transparent),#fff;background-attachment:fixed}}
header{position:sticky;top:0;z-index:4;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.c{transition:transform .25s,box-shadow .25s}
@media(hover:hover){.c:hover{transform:translateY(-3px);box-shadow:0 24px 40px -20px rgba(26,107,240,.5)}}
button.b{position:relative;overflow:hidden}
button.b::after{content:"";position:absolute;top:0;left:-50%;width:30%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);opacity:0;pointer-events:none}
button.b:hover::after{opacity:1;animation:sheen .9s}button.b.s::after,button.b:disabled::after{display:none}
button.b.pick{animation:pulse .35s}button.b.pick::before{content:"✓";margin-right:8px;font-weight:800}
.c.hero{background:linear-gradient(120deg,#1658e8,#19a8ff,#14c2b0,#1a6bf0);background-size:300% 300%;animation:flow 12s ease infinite}
#app>main:last-child>.hero,.in>.hero{animation:up .65s cubic-bezier(.2,.8,.2,1) backwards,flow 12s ease infinite}
.c.hero::before{content:"";position:absolute;left:-50px;bottom:-70px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12);animation:float 9s ease-in-out infinite}

.in .bar i{transform-origin:left;animation:grow 1s cubic-bezier(.2,.8,.2,1) .15s backwards}

.c.res{--ac:#1a6bf0;--ac2:#19b5fe;border:0;box-shadow:0 26px 44px -24px var(--ac),0 0 0 1px #e8eef9;position:relative;overflow:hidden}
.c.res::before{content:"";position:absolute;inset:0 0 auto 0;height:7px;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.res.ideal{--ac:#0fa968;--ac2:#14c8a8}.res.good{--ac:#14b8a6;--ac2:#19b5fe}.res.attn{--ac:#f59e0b;--ac2:#fbbf24}.res.crit{--ac:#ef4444;--ac2:#f97316}
.res .big{background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text}.res p.note{border-left-color:var(--ac)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{display:block;text-align:left;font:inherit;color:var(--tx);background:#fff;border:1px solid var(--ln);border-radius:22px;padding:15px;box-shadow:0 12px 26px -16px rgba(26,107,240,.45);cursor:pointer;transition:transform .2s,box-shadow .2s}
.tile:hover{transform:translateY(-4px);box-shadow:0 22px 34px -16px rgba(26,107,240,.55)}.tile:active{transform:scale(.97)}
.tile b{display:block;font:700 15px Manrope,Inter,sans-serif;margin-top:12px}.tile span{font-size:12.5px;color:var(--mut)}
.ti{display:grid;place-items:center;width:44px;height:44px;border-radius:15px;background:var(--g1);box-shadow:var(--sh)}

.tile:nth-child(2) .ti{background:linear-gradient(135deg,#0fb981,#14b8c4);box-shadow:0 10px 22px -10px rgba(15,185,129,.7)}
.g2>.kpi:nth-child(2)::before{background:linear-gradient(90deg,#0fb981,#14b8c4)}.g2>.kpi:nth-child(3)::before{background:linear-gradient(90deg,#f59e0b,#fbbf24)}.g2>.kpi:nth-child(4)::before{background:linear-gradient(90deg,#6366f1,#8b5cf6)}
.c.kpi{box-shadow:0 14px 28px -18px rgba(26,107,240,.5)}
.toast{animation:toast .35s cubic-bezier(.2,.8,.2,1)}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.in polyline{stroke-dasharray:none;stroke-dashoffset:0}}
@media(min-width:700px){#app .g2:has(>.kpi){grid-template-columns:repeat(4,1fr)}}.g2{align-items:start}</style></head><body><div id="app"></div>
<script>
let CATS=[],Q=[],L=[];
const cat=x=>CATS.find(c=>x<c.m)||CATS[CATS.length-1],fx=x=>x.toFixed(1).replace('.',','),DAY=864e5;
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fd=t=>new Date(t).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
const H=async s=>crypto.subtle?[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('chk:'+s)))].map(b=>b.toString(16).padStart(2,'0')).join(''):btoa(unescape(encodeURIComponent('chk:'+s)));
let S={me:null,tab:'home',qi:0,a:[],res:null,sel:0,slot:null,sid:null,D:{res:[],ap:{items:[],left:0},gl:[],sem:[],sp:null,users:[],sum:null},cred:null};let TOK=sessionStorage.getItem('chk');
async function api(m,p,b){const r=await fetch('/api/v1'+p,{method:m,headers:{'Content-Type':'application/json',...(TOK?{Authorization:'Bearer '+TOK}:{})},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401&&TOK&&p!=='/auth/login'){TOK=null;sessionStorage.removeItem('chk');S.me=null;render()}throw j}return j}
const setTok=t=>{TOK=t;t?sessionStorage.setItem('chk',t):sessionStorage.removeItem('chk')};
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2400)};
const fail=m=>{const e=$('e');if(e)e.textContent=m};
async function load(){const m=S.me;if(!m||m.must)return;const D=S.D;
 if(m.role==='hr'){[D.users,D.sum,D.sem]=await Promise.all([api('GET','/hr/employees'),api('GET','/hr/summary'),api('GET','/hr/seminars')]);return}
 if(!m.cons)return;
 if(!Q.length){const t=await api('GET','/tests/available');CATS=t.categories;Q=t.questions;L=t.scale}
 [D.res,D.sp,D.ap,D.gl,D.sem]=await Promise.all([api('GET','/results/history'),api('GET','/specialists'),api('GET','/appointments'),api('GET','/goals'),api('GET','/seminars')])}
const R=async()=>{await load();render()};
async function login(){try{const r=await api('POST','/auth/login',{login:$('lg').value.trim(),password:$('pw').value});setTok(r.token);S.me=r.user;S.fresh=1;S.tab=S.me.role==='hr'?'sum':'home';S.qi=0;S.a=[];S.res=null;await R()}catch(e){fail(({too_many_attempts:'Вход временно заблокирован после неудачных попыток. Повторите через 15 минут или обратитесь к HR.',blocked:'Учётная запись заблокирована. Обратитесь к HR.'})[e.e]||'Неверный логин или пароль.')}}
const qlogin=(l,p)=>{$('lg').value=l;$('pw').value=p;login()};
async function resetDemo(){await api('POST','/demo/reset');setTok(null);S.me=null;toast('Демо-данные сброшены');render()}
const out=async()=>{try{await api('POST','/auth/logout')}catch(e){}setTok(null);S.me=null;S.tab='home';render()};
async function patch(p){const r=await api('PATCH','/me',p);S.me={...S.me,...r}}
async function setPw(){const a=$('p1').value;if(a.length<6)return fail('Пароль должен быть не короче 6 символов.');if(a!==$('p2').value)return fail('Пароли не совпадают.');const r=await api('POST','/auth/password',{password:a});setTok(r.token);S.me.must=0;toast('Пароль изменён');S.fresh=1;S.tab=S.me.role==='hr'?'sum':'home';await R()}
function pick(v){S.sel=v;render()}
async function next(){const s=await api('POST','/test-sessions/'+S.sid+'/answers',{value:S.sel});S.sel=0;S.a=s.answers;if(S.a.length<Q.length){S.qi=S.a.length;S.fresh=1;return render()}const r=await api('POST','/test-sessions/'+S.sid+'/complete');S.res=r.x;S.a=[];S.qi=0;S.fresh=1;R()}
async function book(){if(!S.slot)return;try{await api('POST','/appointments',{slot:S.slot});toast('Вы записаны: '+S.slot);S.slot=null}catch(e){toast(e.e==='quota'?'Лимит консультаций на год исчерпан':'Это время недоступно');}R()}
async function setAp(id,st){await api('PATCH','/appointments/'+id,{status:st});R()}
async function rsvp(id,v){await api('POST','/seminars/'+id+'/response',{v});R()}
async function addGoal(){const n=$('gn').value.trim(),v=+$('gv').value;if(!n||v<1||v>5)return toast('Укажите название и целевой индекс от 1 до 5');await api('POST','/goals',{n,to:v});R()}
async function addEmp(){try{S.cred=await api('POST','/hr/employees',{dep:$('dp').value.trim(),code:$('cd').value.trim()});R()}catch(e){toast(e.e==='exists'?'Такой логин уже есть':'Код: от 4 до 8 цифр')}}
async function block(id){const u=S.D.users.find(x=>x.id===id);await api('PATCH','/hr/employees/'+id,{status:u.status==='active'?'blocked':'active'});R()}
async function addSem(){const t=$('st').value.trim();if(!t)return toast('Введите название семинара');await api('POST','/hr/seminars',{t,d:$('sd').value.trim(),p:$('sp').value.trim()});R()}
const go=async t=>{S.tab=t;S.fresh=1;if(t==='test'&&S.me.role==='emp'){S.res=null;const s=await api('POST','/test-sessions');S.sid=s.id;S.a=s.answers;S.qi=s.answers.length}render()};
function chart(h){const W=300,H=150,p=24,n=h.length,x=i=>p+(n<2?(W-2*p)/2:i*(W-2*p)/(n-1)),y=s=>H-p-(s-1)*(H-2*p)/4;return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="График динамики индекса"><rect x="${p}" y="${y(2.9)}" width="${W-2*p}" height="${y(2.4)-y(2.9)}" fill="var(--grn)" opacity=".2"/><defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#1a6bf0"/><stop offset="1" stop-color="#19b5fe"/></linearGradient><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a6bf0" stop-opacity=".25"/><stop offset="1" stop-color="#1a6bf0" stop-opacity="0"/></linearGradient></defs><polygon points="${x(0)},${H-p} ${h.map((r,i)=>x(i)+','+y(r.s)).join(' ')} ${x(n-1)},${H-p}" fill="url(#ag)"/><polyline points="${h.map((r,i)=>x(i)+','+y(r.s)).join(' ')}" pathLength="1" fill="none" stroke="url(#lg)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${h.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.s)}" r="4.5" fill="#fff" stroke="var(--sky)" stroke-width="2.5"/><text x="${x(i)}" y="${y(r.s)-8}" font-size="11" text-anchor="middle" fill="var(--tx)">${fx(r.s)}</text>`).join('')}</svg><div class="mut">Зелёная полоса — диапазон нормы (2,4–2,8 из 5). Чем ниже индекс, тем лучше.</div>`}
const resCard=x=>{const c=cat(x);return `<div class="c res ${c.code}"><div style="display:flex;align-items:center;gap:10px"><span style="font-size:36px;line-height:1">${c.i}</span><span class="big">${fx(x)}</span><span class="mut">из 5</span></div><div class="mut">индекс выгорания</div><h3 style="margin-top:8px">Категория: ${c.n}</h3><div class="mut">Диапазон нормы: 2,4–2,8. ${x>=2.9?'Выше нормы (хуже).':x<2.4?'Ниже нормы (лучше).':'В пределах нормы.'}</div><p class="note">${c.tip}</p>${c.sp?`<button class="b" onclick="go('support')">Поддержка психолога</button>`:''}<p class="mut">Категория — внутренний показатель продукта, а не медицинский диагноз.</p></div>`};
const vLogin=()=>`<main style="padding-top:6px"><div class="c hero" style="padding:30px 22px"><div style="font:800 34px/1.1 Manrope,Inter,sans-serif;letter-spacing:-.03em">Человек,<br>а не ресурс</div><div class="mut" style="margin-top:10px">Забота о состоянии сотрудников — основа сильной компании</div></div><div class="c"><h3>Вход</h3><p class="mut">Войдите по логину и паролю, которые выдал работодатель.</p><label>Логин<input id="lg" autocomplete="username" placeholder="EVRZ_010203"></label><label>Пароль<input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></label><div id="e" class="err" role="alert"></div><button class="b" onclick="login()">Войти</button></div>${S.demo?`<div class="c"><h3>Демо-режим</h3><button class="b s" onclick="qlogin('EVRZ_010203','evraz1')">👷 Сотрудник с историей опросов</button><button class="b s" onclick="qlogin('ZSMK_010203','zsmk1')">🆕 Сотрудник: первый вход</button><button class="b s" onclick="qlogin('EVRZ_HR','hr123')">📊 Панель HR (ЕВРАЗ)</button><button class="b s" onclick="qlogin('ZSMK_HR','hr123')">📊 Панель HR (ЗСМК, мало данных)</button><button class="b s" onclick="resetDemo()">↺ Сбросить демо-данные</button></div>`:''}<div class="c mut"><b>Демо-доступ</b> (создаётся при первом запуске сервера)<br>Сотрудник: EVRZ_010203 / evraz1 (ещё 10 демо-сотрудников, пароль demo12)<br>Первый вход: ZSMK_010203 / zsmk1<br>HR: EVRZ_HR или ZSMK_HR / hr123</div></main>`;
const vPw=()=>`<main><div class="c"><h2>Первый вход: смените пароль</h2><p class="mut">Временный пароль нужно заменить на свой.</p><input id="p1" type="password" placeholder="Новый пароль (от 6 символов)"><input id="p2" type="password" placeholder="Повторите пароль"><div id="e" class="err" role="alert"></div><button class="b" onclick="setPw()">Сохранить пароль</button></div></main>`;
const vCons=()=>`<main><div class="c"><h2>Добро пожаловать</h2><div class="mut">Согласие и приватность</div></div><div class="c n2">Ответы видны только вам</div><div class="c n2">Руководителю — только обезличенные данные по отделу (от 5 человек)</div><div class="c n2">Участие добровольное, можно выйти в любой момент</div><label class="c" style="display:flex;gap:12px;align-items:center"><input type="checkbox" style="width:24px;height:24px;margin:0" onchange="$('cb').disabled=!this.checked"> Согласен(на) на обработку данных (152-ФЗ)</label><button id="cb" class="b" disabled onclick="patch({cons:1}).then(async()=>{await load();go(S.D.res.length?'home':'test')})">Продолжить</button></main>`;
function vHome(){const u=S.me,h=S.D.res,l=h[h.length-1],due=l&&u.rem&&Date.now()-l.ts>7*DAY;return `<div class="c hero"><span class="tag">${u.org} · ${esc(u.dep)}</span><h2 style="margin-top:8px">${u.av} Здравствуйте, ${esc(u.nick)}!</h2>${due?`<div class="err">⏰ Пора пройти еженедельный опрос (${u.t}).</div>`:''}${h.length?`<div class="mut">Опросов пройдено: ${h.length}.</div><button class="b" onclick="go('test')">Пройти опрос</button>`:`<div class="mut">Пройдите обязательный первичный опрос — он откроет остальные разделы.</div><button class="b" onclick="go('test')">Начать первичный опрос</button>`}</div>${l?`<h3>Последний результат · ${fd(l.ts)}</h3>${resCard(l.x)}`:''}<div class="tiles"><button class="tile" onclick="go('support')"><i class="ti">${ICO.support}</i><b>Психолог</b><span>Запись, 4 консультации в год</span></button><button class="tile" onclick="go('stats')"><i class="ti">${ICO.stats}</i><b>Статистика</b><span>Динамика и цели</span></button></div>`}
function vTest(){const h=S.D.res;if(S.res!==null)return `<h2>Мой результат</h2>${resCard(S.res)}<p class="mut">Результат сохранён и добавлен в историю.</p><button class="b s" onclick="S.res=null;go('home')">На главную</button>`;return `<h2>${h.length?'Пульс-опрос':'Первичный опрос'} <span class="mut">(≈2 мин)</span></h2><div class="c"><div class="mut">Вопрос ${S.qi+1} из ${Q.length}</div><div class="bar" aria-hidden="true"><i style="width:${(S.qi+1)/Q.length*100}%"></i></div><h3 style="margin:14px 0 8px;text-align:center">${Q[S.qi]}</h3>${L.map((t,i)=>`<button class="b s ${S.sel===i+1?'pick':''}" onclick="pick(${i+1})">${t}</button>`).join('')}<button class="b" ${S.sel?'':'disabled'} onclick="next()">${S.qi<Q.length-1?'Далее':'Завершить'}</button></div><p class="mut">Демо-методика: индекс выгорания — среднее по 5 ответам (1–5). Настоящие вопросы и пороги утверждаются отдельно (п. 19 ТЗ).</p>`}
const lock=()=>`<div class="c"><h2>🔒 Раздел пока закрыт</h2><p class="mut">Сначала пройдите обязательный первичный тест.</p><button class="b" onclick="go('test')">Пройти тест</button></div>`;
function vSup(){const D=S.D,u=S.me,s=D.sp&&D.sp.sp;if(!D.res.length)return lock();if(!s)return '<div class="c">Психолог для вашего предприятия пока не назначен.</div>';const left=D.ap.left;return `<h2>Конфиденциальная помощь</h2><div class="c"><h3>${esc(s.n)}</h3><div class="mut">${esc(s.s)} · ${esc(s.f)}<br>Контакт: ${esc(s.c)}</div><p class="mut">Доступно консультаций в этом году: <b>${left}</b> из 4</p>${s.sl.filter(x=>!D.sp.taken.includes(x)).map(x=>`<button class="b s slot ${S.slot===x?'pick':''}" onclick="S.slot='${x}';render()"><span>${x}</span><span>${s.f.includes('нлайн')?'онлайн':'очно'}</span></button>`).join('')||'<span class="mut">Свободных интервалов нет.</span>'}<div class="c ok" style="margin:10px 0 0">Работодатель не видит факт обращения и его содержание</div><button class="b" ${S.slot&&left>0?'':'disabled'} onclick="book()">Записаться</button></div><div class="c"><h3>Мои записи</h3>${D.ap.items.map(a=>`<div class="row"><span>${esc(a.s)}<br><span class="mut">${a.st}</span></span>${a.st==='Запланировано'?`<button class="b sm s" onclick="setAp('${a.id}','Отменено')">Отменить</button>`:''}</div>`).join('')||'<div class="mut">Записей пока нет.</div>'}</div><h3>Семинары</h3>${D.sem.map(m=>`<div class="c"><b>${esc(m.t)}</b><div class="mut">${esc(m.d)} · ${esc(m.p)}</div><div>Ваш ответ: <b>${m.r||'Ответ не дан'}</b></div><button class="b sm ${m.r==='Иду'?'on':''}" onclick="rsvp('${m.id}','Иду')">Иду</button><button class="b sm s ${m.r==='Не иду'?'on':''}" onclick="rsvp('${m.id}','Не иду')">Не иду</button></div>`).join('')||'<div class="c mut">Семинаров пока нет.</div>'}`}
function vStat(){const D=S.D,h=D.res.map(r=>({s:r.x,d:fd(r.ts),c:r.cat}));if(!h.length)return lock();const l=h[h.length-1].s,f=h[0].s,d=l-f;return `<h2>Статистика</h2><div class="c"><h3>Динамика</h3>${chart(h)}</div><div class="c"><h3>До и после</h3><div class="mut">Первый результат: ${fx(f)}. Последний: ${fx(l)}. Изменение: <b>${d>0?'+':''}${fx(d)}</b> ${d>.05?'(индекс вырос — хуже)':d<-.05?'(индекс снизился — лучше)':'(без изменений)'}</div></div><div class="c"><h3>История</h3>${h.slice().reverse().map(r=>`<div class="row"><span>${r.d}</span><span>${fx(r.s)} · ${r.c.i} ${r.c.n}</span></div>`).join('')}</div><div class="c"><h3>Цели</h3>${D.gl.map(g=>`<div style="margin-bottom:10px">${esc(g.n)}<div class="bar"><i style="width:${Math.min(100,g.to/l*100)}%"></i></div><div class="mut">Сейчас ${fx(l)}, цель — не выше ${fx(g.to)} · ${l<=g.to?'цель достигнута':'в процессе'}</div></div>`).join('')||'<div class="mut">Целей пока нет.</div>'}<input id="gn" placeholder="Новая цель"><input id="gv" type="number" step="0.1" min="1" max="5" placeholder="Целевой индекс, не выше (1–5)"><button class="b s" onclick="addGoal()">Добавить цель</button></div>`}
function vProf(){const u=S.me;return `<h2>Профиль</h2><div class="c"><div class="big">${u.av}</div><div class="mut">Логин: <b>${u.id}</b><br>Предприятие: ${u.org} · ${esc(u.dep)}</div><input id="nk" value="${esc(u.nick)}" aria-label="Никнейм"><button class="b s" onclick="patch({nick:$('nk').value.trim()||S.me.nick}).then(()=>{toast('Никнейм сохранён');render()})">Сохранить никнейм</button></div>${u.role==='hr'?'':`<div class="c"><h3>Напоминания</h3><div class="row"><span>Еженедельный тест</span><button class="b sm ${u.rem?'':'s'}" style="margin:0" onclick="patch({rem:!S.me.rem}).then(render)">${u.rem?'Включено':'Выключено'}</button></div>${u.rem?`<label class="mut">Время<input type="time" value="${u.t}" onchange="patch({t:this.value});toast('Время сохранено')"></label>`:''}</div>`}<div class="c"><h3>Смена пароля</h3><input id="p1" type="password" placeholder="Новый пароль"><input id="p2" type="password" placeholder="Повторите пароль"><div id="e" class="err" role="alert"></div><button class="b s" onclick="setPw()">Сменить пароль</button></div>${u.role==='hr'?'':`<button class="b s" onclick="patch({cons:0}).then(out)">Отозвать согласие и выйти</button>`}<button class="b s" onclick="out()">Выйти</button>`}
function vSum(){const m=S.D.sum,K=m.K,col=x=>x<2.4?'var(--grn)':x<3.2?'var(--warn)':'var(--bad)',kp=(t,v)=>`<div class="c kpi" style="margin:0"><div class="mut">${t}</div><div class="big">${v}</div></div>`;
 return `<div class="c n2" style="font-weight:700">Панель HR · ${m.org}: только агрегированные данные (группы от ${K} человек)</div><div class="g2" style="margin-bottom:12px">${kp('Участие в опросах',m.part+' %')}${kp('Установили приложение',m.inst+' %')}${kp('Динамика переработок',m.od===null?'н/д':(m.od>0?'+':'')+m.od+' %')}${kp('Консультации (обезл.)',m.nc===null?'н/д':m.nc)}</div><div class="g2"><div class="c"><h3>Индекс выгорания по отделам (1–5)</h3>${m.deps.map(d=>d.avg===null?`<div class="mx"><span>${esc(d.dep)}</span><span class="mut" style="grid-column:2/4">недостаточно данных (менее ${K} человек)</span></div>`:`<div class="mx"><span>${esc(d.dep)}</span><div class="bar"><i style="width:${d.avg/5*100}%;background:${col(d.avg)}"></i></div><b>${fx(d.avg)}</b></div>`).join('')||'<span class="mut">Нет данных</span>'}</div><div class="c"><h3>Динамика, 6 недель</h3>${m.wk.length>1?chart(m.wk):'<span class="mut">Недостаточно данных для графика.</span>'}</div></div><div class="c"><h3>Рекомендации для HR (обезличенно)</h3>${m.recs.map(r=>`<div>• ${esc(r)}</div>`).join('')||'<div>• Критических отклонений в группах от 5 человек не выявлено</div>'}<div style="color:var(--grn)">• Список сотрудников и их ответы в панели не отображаются</div></div><div class="g2"><div class="c"><h3>🔒 Не видно</h3>Ответы и результаты отдельных сотрудников, имена, факт и содержание консультаций</div><div class="c"><h3>🛡️ Видно</h3>Агрегированные показатели по отделам от ${K} человек и обезличенные рекомендации</div><div class="c"><h3>🤝 Решает сотрудник</h3>Обращаться ли к психологу — решение принимает сам человек</div></div>`}
function vEmp(){const D=S.D,c=S.cred;return `<h2>Сотрудники</h2>${c?`<div class="c" style="border-color:var(--grn)"><b>Учётная запись создана</b><br>Логин: <b>${c.id}</b><br>Временный пароль: <b>${c.pw}</b><div class="mut">Передайте сотруднику: пароль показывается один раз.</div></div>`:''}<div class="c"><h3>Новый сотрудник</h3><input id="dp" placeholder="Подразделение"><input id="cd" placeholder="Код (4–8 цифр, пусто — случайный)" inputmode="numeric"><button class="b" onclick="addEmp()">Создать учётную запись</button></div><div class="c">${D.users.map(u=>`<div class="row"><span>${u.id}<br><span class="mut">${esc(u.dep)} · ${u.status==='active'?'активен':'заблокирован'}</span></span><button class="b sm s" onclick="block('${u.id}')">${u.status==='active'?'Заблокировать':'Разблокировать'}</button></div>`).join('')||'<div class="mut">Сотрудников нет.</div>'}</div>`}
function vSemHr(){const D=S.D;return `<h2>Семинары</h2><div class="c"><h3>Новый семинар</h3><input id="st" placeholder="Название"><input id="sd" placeholder="Дата и время"><input id="sp" placeholder="Место или ссылка"><button class="b" onclick="addSem()">Создать семинар</button></div>${D.sem.map(m=>`<div class="c"><b>${esc(m.t)}</b><div class="mut">${esc(m.d)} · ${esc(m.p)}</div>Иду: <b>${m.yes}</b> · Не иду: <b>${m.no}</b></div>`).join('')}`}
const IC=p=>`<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`,ICO={test:IC('<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M9 12l2 2 4-4"/>'),support:IC('<path d="M21 12a8.5 8.5 0 01-12.2 7.6L3 21l1.5-5.2A8.5 8.5 0 1121 12z"/>'),stats:IC('<path d="M5 20v-8M12 20V5M19 20v-5"/>'),profile:IC('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'),sum:IC('<rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/>'),emp:IC('<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-5.5 7-5.5s7 2 7 5.5M16 4.5a3.5 3.5 0 010 7M22 20c0-3-2-4.8-5-5.3"/>'),sem:IC('<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/>')};
function countUp(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;document.querySelectorAll('.big').forEach(el=>{const m=el.textContent.match(/^([+-]?)(\d+(?:,\d+)?)(.*)$/);if(!m)return;const to=parseFloat(m[2].replace(',','.')),d=m[2].includes(','),t0=performance.now(),st=t=>{const k=Math.min(1,(t-t0)/900),v=to*(1-Math.pow(1-k,3));el.textContent=m[1]+(d?v.toFixed(1).replace('.',','):Math.round(v))+m[3];if(k<1)requestAnimationFrame(st)};requestAnimationFrame(st)})}
function render(){const a=$('app'),m=S.me,f=S.fresh;S.fresh=0;if(!m){a.style.maxWidth='430px';a.innerHTML=`<header><b>Checkys</b></header>`+vLogin();return}
 if(m.must){a.innerHTML=`<header><b>Checkys</b></header>`+vPw();return}
 if(m.role==='emp'&&!m.cons){a.innerHTML=`<header><b>Checkys</b></header>`+vCons();return}const hr=m.role==='hr';a.style.maxWidth=hr?'860px':'430px';
 const V=(hr?{sum:vSum,emp:vEmp,sem:vSemHr,profile:vProf}:{home:vHome,test:vTest,support:vSup,stats:vStat,profile:vProf})[S.tab]();
 const N=hr?[['sum',ICO.sum,'Сводка'],['emp',ICO.emp,'Сотрудники'],['sem',ICO.sem,'Семинары'],['profile',ICO.profile,'Профиль']]:[['test',ICO.test,'Тест'],['support',ICO.support,'Поддержка'],['stats',ICO.stats,'Статистика'],['profile',ICO.profile,'Профиль']];
 a.innerHTML=`<header><b onclick="go('${hr?'sum':'home'}')">Checkys${hr?' · панель HR':''}</b><small>${m.org}</small></header><main class="${f?'in':''}">${V}</main><nav>${N.map(n=>`<button class="${S.tab===n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}${n[2]}</button>`).join('')}</nav>`;if(f&&document.querySelectorAll)countUp()}
(async()=>{try{S.demo=(await api('GET','/demo')).demo}catch(e){}if(TOK){try{S.me=await api('GET','/me');S.tab=S.me.role==='hr'?'sum':'home';await load()}catch(e){setTok(null);S.me=null}}render()})();
</script></body></html>
